<!DOCTYPE html>
<html>

<head>

    <title>Login - PassionHub</title>

    <style>

        body {
            margin: 0;
            background: #0b0d12;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 360px;
            background: #151920;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #303540;
        }

        h1 {
            text-align: center;
        }

        span {
            color: #ff6b2c;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #343944;
            background: #0d1016;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #ff6b2c;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ff6b6b;
            text-align: center;
        }

        a {
            color: #ff7840;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>
        ⚡ Passion<span>Hub</span>
    </h1>

    <h2>Welcome Back</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

   <div style="text-align:center; margin-top:15px;">

    <a href="/forgot-password">
        Forgot Password?
    </a>

</div>

<div class="bottom">

    Don't have an account?

    <a href="/signup">
        Create Account
    </a>

</div>

</div>

</body>

</html>
