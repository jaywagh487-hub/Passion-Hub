<!DOCTYPE html>
<html>
<head>
    <title>Sign Up - PassionHub</title>

    <style>
        body {
            margin: 0;
            background: #0b0d12;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 420px;
            background: #151920;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #303540;
        }

        h1 {
            text-align: center;
        }

        .orange {
            color: #ff6b2c;
        }

        input {
            width: 100%;
            padding: 13px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #343944;
            background: #0d1016;
            color: white;
        }

        .community-title {
            margin-top: 20px;
        }

        .communities {
            display: flex;
            gap: 10px;
        }

        .community {
            flex: 1;
            padding: 18px;
            text-align: center;
            background: #1b1f27;
            border: 1px solid #343944;
            border-radius: 10px;
            cursor: pointer;
        }

        .community:hover {
            border-color: #ff6b2c;
        }

        .community input {
            display: none;
        }

        .community:has(input:checked) {
            border-color: #ff6b2c;
            background: #2a1a13;
        }

        .icon {
            display: block;
            font-size: 35px;
            margin-bottom: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 20px;
            background: #ff6b2c;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ff6666;
            text-align: center;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
            color: #888;
        }

        a {
            color: #ff7840;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>
        ⚡ Passion<span class="orange">Hub</span>
    </h1>

    <h2>Create Account</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >

        <input
            type="password"
            name="password"
            placeholder="Password"
            minlength="6"
            required
        >

        <div class="community-title">
            <b>Choose your primary community</b>
        </div>

        <div class="communities">

            <label class="community">

                <input
                    type="radio"
                    name="community"
                    value="biker"
                    required
                >

                <span class="icon">🏍️</span>

                Biker

            </label>


            <label class="community">

                <input
                    type="radio"
                    name="community"
                    value="gamer"
                    required
                >

                <span class="icon">🎮</span>

                Gamer

            </label>

        </div>

        <button type="submit">
            Create Account →
        </button>

    </form>

    <div class="bottom">

        Already have an account?

        <a href="/login">
            Login
        </a>

    </div>

</div>

</body>
</html>
