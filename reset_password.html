<!DOCTYPE html>
<html>

<head>

    <title>Reset Password - PassionHub</title>

    <style>

        body {
            margin: 0;
            background: #0b0d12;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 360px;
            background: #151920;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #303540;
        }

        h1 {
            text-align: center;
        }

        span {
            color: #ff6b2c;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #343944;
            background: #0d1016;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #ff6b2c;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        .error {
            color: #ff6464;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>
        ⚡ Passion<span>Hub</span>
    </h1>

    <h2>Reset Password</h2>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="password"
            name="password"
            placeholder="New password"
            required
        >

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

</div>

</body>

</html>
