<!DOCTYPE html>
<html>

<head>

    <title>Forgot Password - PassionHub</title>

    <style>

        body {
            margin: 0;
            background: #0b0d12;
            color: white;
            font-family: Arial;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .box {
            width: 360px;
            background: #151920;
            padding: 35px;
            border-radius: 15px;
            border: 1px solid #303540;
        }

        h1 {
            text-align: center;
        }

        span {
            color: #ff6b2c;
        }

        p {
            color: #8c95a5;
            line-height: 1.5;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #343944;
            background: #0d1016;
            color: white;
        }

        button {
            width: 100%;
            padding: 13px;
            margin-top: 15px;
            background: #ff6b2c;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }

        a {
            color: #ff7840;
        }

        .error {
            color: #ff6464;
        }

        .bottom {
            text-align: center;
            margin-top: 20px;
        }

    </style>

</head>

<body>

<div class="box">

    <h1>
        ⚡ Passion<span>Hub</span>
    </h1>

    <h2>Forgot Password?</h2>

    <p>
        Enter your registered email address
        to reset your password.
    </p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="POST">

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Continue →
        </button>

    </form>

    <div class="bottom">

        <a href="/login">
            ← Back to Login
        </a>

    </div>

</div>

</body>

</html>
